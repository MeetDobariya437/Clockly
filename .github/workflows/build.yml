name: Release Multiplatform Installers

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'windows'
            args: '--bundles nsis'
          - platform: 'macos-latest'
            name: 'macos'
            args: '--bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Clocky v__VERSION__'
          releaseBody: 'Download Clocky for your operating system: Windows (.exe / .msi) or macOS (.dmg).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Installers
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: clocky-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload macOS Installers
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: clocky-macos-installers
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

