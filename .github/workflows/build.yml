name: Release Multiplatform Installers

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'windows'
            args: ''
          - platform: 'macos-latest'
            name: 'macos'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Clocky v__VERSION__'
          releaseBody: 'Download Clocky for your operating system: Windows (.exe / .msi) or macOS (.dmg).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Installers
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: clocky-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload macOS Installers
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: clocky-macos-installers
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Initialize & Build Android APK
        run: |
          npx tauri android init
          npx tauri android build --apk --target aarch64-linux-android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: clocky-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: warn

